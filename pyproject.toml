[project]
name = "qdev"
version = "0.2.0"
description = "Quantum experiments"
authors = [
    {name = "Beilak",email = "beylak@yandex.ru"}
]
requires-python = ">=3.14,<3.15"
package-mode = false

dependencies = [
    "qiskit[visualization] (>=2.5.1,<3.0.0)",
    "qiskit-ibm-runtime (>=0.48.0,<0.49.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pylatexenc (>=2.10,<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
noutbook = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
